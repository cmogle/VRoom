<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>VROOM</title>
  <style>
    :root {
      --ink: #1c2321;
      --paper: #f2ede3;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; }
    body {
      font-family: "Courier New", ui-monospace, monospace;
      color: var(--ink);
      background: var(--paper);
    }
    canvas { display: block; }

    .hud {
      position: fixed;
      inset: 0;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 20px 24px;
    }
    .hud .row {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
    }
    .title {
      font-size: 14px;
      letter-spacing: 0.35em;
      font-weight: bold;
    }
    .hint {
      font-size: 12px;
      letter-spacing: 0.1em;
      opacity: 0.7;
    }
    .speed {
      font-size: 40px;
      font-weight: bold;
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }
    .speed small {
      font-size: 12px;
      letter-spacing: 0.2em;
      font-weight: normal;
      opacity: 0.7;
    }
    @media (max-width: 600px) {
      .hint { display: none; }
      .speed { font-size: 28px; }
    }
  </style>
</head>
<body>
  <div class="hud">
    <div class="row">
      <div class="title">VROOM</div>
      <div class="hint">WASD / arrows to drive &nbsp;·&nbsp; space = handbrake &nbsp;·&nbsp; R = reset</div>
    </div>
    <div class="row">
      <div></div>
      <div class="speed"><span id="speed">0</span> <small>KM/H</small></div>
    </div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
